name: Java CI with Allure Report

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Поднимаем браузер прямо в облаке
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Run API Tests
        # Используем полный путь к сьюту, который мы нашли в проекте
        run: mvn test -DsuiteXmlFile=src/test/resources/suites/api.xml -DreuseForks=false
        continue-on-error: true # Чтобы UI тесты запустились, если API упадут

      - name: Run UI Tests
        # ПЕРЕДАЕМ АДРЕС ВНУТРЕННЕГО ГРИДА (localhost:4444)
        run: mvn test -DsuiteXmlFile=src/test/resources/suites/ui.xml -Dgrid.url=http://localhost:4444 -DreuseForks=false
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages